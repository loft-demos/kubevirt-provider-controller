apiVersion: v1
kind: Namespace
metadata:
  name: kubevirt-provider-controller-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubevirt-provider-controller
  namespace: kubevirt-provider-controller-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubevirt-provider-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubevirt-provider-controller
    spec:
      serviceAccountName: kubevirt-provider-controller
      containers:
        - name: controller
          image: ghcr.io/loft-sh/kubevirt-provider-controller:dev
          imagePullPolicy: IfNotPresent
          args: ["--workers=2", "--resync-period=30s"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 256Mi}

