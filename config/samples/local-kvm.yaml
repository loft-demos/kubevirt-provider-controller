apiVersion: infra.loft.sh/v1alpha1
kind: KubeVirtProviderCluster
metadata:
  name: local-kvm-provider
  namespace: p-platform
spec:
  virtualCluster:
    name: local-kvm-provider
    # Optional: pin the Private Node vCluster control plane to a specific connected
    # cluster. When omitted, the Platform scheduler chooses. Set it to the Platform
    # (host) cluster so the agent peers directly with loft instead of relaying
    # through the Platform proxy.
    clusterRef:
      cluster: loft-cluster
    owner:
      # Use a Platform User resource name (for example "admin"), not an email.
      user: REPLACE_WITH_PLATFORM_USER_NAME
    templateRef:
      name: private-node-kubevirt-provider
    # Structured VirtualClusterTemplate parameter values, keyed by each template
    # parameter's variable name. Marshaled to YAML and passed to the generated
    # VirtualClusterInstance as spec.parameters. Any parameters the referenced
    # template defines can be set here. Mutually exclusive with parameters.
    parameterValues:
      nodePoolQuantity: 1
  connectedCluster:
    name: local-kvm-provider
    managementNamespace: vcluster-platform
  agent:
    kubeconfigTTLSeconds: 600
    chart:
      # Pin this to the exact vCluster Platform version under test. tokenSecretRef
      # requires a chart version that contains that feature.
      version: REPLACE_WITH_PLATFORM_VERSION
  nodeProvider:
    name: local-kvm
    targetNamespace: vcluster-platform
    template:
      spec:
        displayName: Local KVM passthrough
        properties:
          kubevirt.vcluster.com/image-url: docker://quay.io/containerdisks/ubuntu:24.04
          kubevirt.vcluster.com/root-disk-size: 20Gi
        kubeVirt:
          # The controller overwrites clusterRef.
          clusterRef: {}
          deploy:
            kubevirt:
              enabled: true
              helmValues: |-
                kubevirt:
                  operator:
                    # Private Node vClusters have no control-plane node, so KubeVirt's
                    # default virt-operator nodeAffinity (requires control-plane/master)
                    # can never match. Null it so virt-operator schedules on the private
                    # worker nodes; nodeSelector (os: linux) and soft anti-affinity remain.
                    affinity:
                      nodeAffinity: null
                  spec:
                    infra:
                      nodePlacement:
                        affinity:
                          # KubeVirt's install strategy dumper and infra
                          # components default to role-label affinity. Private
                          # Node vClusters may have no node-role labels, so pin
                          # infra components to Linux nodes explicitly.
                          nodeAffinity:
                            requiredDuringSchedulingIgnoredDuringExecution:
                              nodeSelectorTerms:
                                - matchExpressions:
                                    - key: kubernetes.io/os
                                      operator: In
                                      values:
                                        - linux
                    configuration:
                      developerConfiguration:
                        # Explicitly require /dev/kvm; never hide missing KVM by
                        # falling back to QEMU software emulation.
                        useEmulation: false
                        featureGates:
                          - GPU
                          - DisableMDEVConfiguration
                      permittedHostDevices:
                        # GPU passthrough (config demo). externalResourceProvider means an
                        # external NVIDIA GPU Operator device plugin advertises these. No
                        # local GPU here, so no node advertises them and GPU-requesting VMs
                        # stay Pending; the PCI IDs are real (pci.ids) for a credible demo.
                        pciHostDevices:
                          - externalResourceProvider: true
                            pciVendorSelector: "10DE:2901"        # GB100 [B200]
                            resourceName: nvidia.com/GB100_B200
                          - externalResourceProvider: true
                            pciVendorSelector: "10DE:3182"        # GB110 [B300 SXM6 AC]
                            resourceName: nvidia.com/GB110_B300
          virtualMachineTemplate:
            spec:
              runStrategy: Always
              template:
                spec:
                  domain:
                    cpu:
                      cores: 2
                    devices:
                      interfaces:
                        - name: default
                          masquerade: {}
                    resources:
                      requests:
                        cpu: "2"
                        memory: 2Gi
                  networks:
                    - name: default
                      pod: {}
          nodeTypes:
            - name: kvm-small
              displayName: KVM VM (2 CPU, 2 GiB)
              maxCapacity: 4
