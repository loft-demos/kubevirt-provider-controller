# Replace the connector, host cluster, storage class, and chart version for the lab.
apiVersion: management.loft.sh/v1
kind: VirtualClusterTemplate
metadata:
  name: private-node-kubevirt-provider
spec:
  displayName: Private Node KubeVirt provider control plane
  template:
    pro:
      enabled: true
    helmRelease:
      chart:
        name: vcluster
        version: 0.36.0
      values: |-
        controlPlane:
          distro:
            k8s:
              version: v1.35.0
          statefulSet:
            persistence:
              volumeClaim:
                enabled: true
                size: 5Gi
          # Required by this PoV's short-lived client-certificate bootstrap.
          # v2 Argo itself still uses the Platform proxy.
          service:
            spec:
              type: LoadBalancer
        privateNodes:
          enabled: true
        integrations:
          argoCD:
            enabled: true
            connector: my-argocd-v2-connector
        deploy:
          cni:
            flannel:
              enabled: true
          kubeProxy:
            enabled: true
          metricsServer:
            enabled: true
    instanceTemplate:
      metadata:
        labels:
          infra.loft.sh/purpose: kubevirt-provider
  access:
    - verbs: [get]
      users: ["*"]
