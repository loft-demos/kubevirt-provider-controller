# Replace the connector, host cluster, storage class, and chart version for the lab.
apiVersion: management.loft.sh/v1
kind: VirtualClusterTemplate
metadata:
  name: private-node-kubevirt-provider
spec:
  displayName: Private Node KubeVirt provider control plane
  template:
    pro:
      enabled: true
    helmRelease:
      chart:
        name: vcluster
        version: 0.36.0
      values: |-
        controlPlane:
          distro:
            k8s:
              version: v1.35.0
          statefulSet:
            persistence:
              volumeClaim:
                enabled: true
                size: 5Gi
        privateNodes:
          enabled: true
          autoNodes:
            - provider: us-va-blacksburg-dc1
              static:
                - name: node-pool-1
                  # Driven by the nodePoolQuantity template parameter so a
                  # KubeVirtProviderCluster can size the pool via
                  # spec.virtualCluster.parameterValues.
                  quantity: {{ .Values.nodePoolQuantity }}
                  nodeTypeSelector:
                    - property: vcluster.com/profile
                      operator: In
                      values:
                        - xlarge
        integrations:
          argoCD:
            enabled: true
            connector: my-argocd-v2-connector
        deploy:
          cni:
            flannel:
              enabled: true
          kubeProxy:
            enabled: true
          metricsServer:
            enabled: true
    instanceTemplate:
      metadata:
        labels:
          infra.loft.sh/purpose: kubevirt-provider
  parameters:
    - variable: nodePoolQuantity
      label: Node Pool Quantity
      description: >
        Number of static Private Nodes the KubeVirt provider control plane
        provisions from us-va-blacksburg-dc1. Supplied per provider cluster via
        spec.virtualCluster.parameterValues.nodePoolQuantity.
      type: number
      defaultValue: "1"
      min: 1
      max: 10
  access:
    - verbs: [get]
      users: ["*"]
